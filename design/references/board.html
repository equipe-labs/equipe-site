<h1>레퍼런스 보드</h1><p class="summary">레퍼런스: 13 · 출처: 13</p><p class="brief">처음 온 메이커가 3초 안에 내 팀이 이미 일하고 있고, 나는 큰 결정만 하면 된다고 느끼는 조용한 관제실</p><p class="rule">패턴과 레이아웃을 배웁니다. 다른 회사의 로고, 이름, 브랜드 마크, 문구는 절대 가져오지 않습니다.</p><main><figure><div class="shot"><img src="R1/1280.png" alt=""></div><figcaption><p class="meta"><b>R1</b> · dessn.ai · 2026-11-08</p><p class="chips"><span class="chip">패턴</span></p><p class="learn">실제 제품 캔버스를 히어로 증거로 쓰고, 변형 상태를 나란히 보여 주는 법</p><p class="url">https://www.dessn.ai/</p></figcaption></figure><figure><div class="shot"><img src="R2/1280.png" alt=""></div><figcaption><p class="meta"><b>R2</b> · proofeditor.ai · 2026-11-08</p><p class="chips"><span class="chip">레이아웃</span></p><p class="learn">사람과 에이전트가 같은 문서에서 주고받는 한 장면으로 협업을 설명하는 법</p><p class="url">https://www.proofeditor.ai/</p></figcaption></figure><figure><div class="shot"><img src="R3/1280.png" alt=""></div><figcaption><p class="meta"><b>R3</b> · tines.com · 2026-11-08</p><p class="chips"><span class="chip">리듬</span></p><p class="learn">복잡한 자동화 제품을 Build·Deploy·Operationalize 세 행동으로 묶는 정보 구조</p><p class="url">https://www.tines.com/</p></figcaption></figure><figure><div class="shot"><img src="R4/1280.png" alt=""></div><figcaption><p class="meta"><b>R4</b> · offloop.org · 2026-11-08</p><p class="chips"><span class="chip">패턴</span></p><p class="learn">사람과 에이전트의 공유 작업공간을 실제 채널과 상태로 보여 주는 법</p><p class="url">https://offloop.org/</p></figcaption></figure><figure><div class="shot"><img src="R5/1280.png" alt=""></div><figcaption><p class="meta"><b>R5</b> · attio.com · 2026-11-08</p><p class="chips"><span class="chip">타입</span></p><p class="learn">데이터가 움직이는 제품을 큰 화면 크롭과 절제된 타이포로 증명하는 법</p><p class="url">https://attio.com/</p></figcaption></figure><figure><div class="shot"><img src="R6/browser.jpg" alt=""></div><figcaption><p class="meta"><b>R6</b> · cursor.com · 2026-11-08</p><p class="chips"><span class="chip">레이아웃</span></p><p class="learn">작은 범주형 헤드라인 뒤에 실제 에이전트 작업 목록을 가장 큰 시각 증거로 두는 법</p><p class="url">https://cursor.com/</p></figcaption></figure><figure><div class="shot"><img src="R7/browser.jpg" alt=""></div><figcaption><p class="meta"><b>R7</b> · linear.app · 2026-11-08</p><p class="chips"><span class="chip">색</span></p><p class="learn">크롬은 물러나고 실제 이슈·활동·에이전트 상태만 빛과 명암으로 앞으로 오게 하는 법</p><p class="url">https://linear.app/</p></figcaption></figure><figure><div class="shot"><img src="R8/browser.jpg" alt=""></div><figcaption><p class="meta"><b>R8</b> · 21st.dev · 2026-11-08</p><p class="chips"><span class="chip">패턴</span></p><p class="learn">완료·진행 중·예정 세 상태를 작은 세로 로그 하나로 읽히게 하는 상태 문법</p><p class="url">https://21st.dev/@ephraimduncan/components/onboarding-06</p></figcaption></figure><figure><div class="shot"><img src="R9/browser.jpg" alt=""></div><figcaption><p class="meta"><b>R9</b> · granola.ai · 2026-11-08</p><p class="chips"><span class="chip">레이아웃</span></p><p class="learn">폰 방문자에게 iOS 앱과 Mac 링크 보내기를 같은 화면에서 이어 주는 다음 행동</p><p class="url">https://www.granola.ai/</p></figcaption></figure><figure><div class="shot"><img src="R10/browser.jpg" alt=""></div><figcaption><p class="meta"><b>R10</b> · diabrowser.com · 2026-11-08</p><p class="chips"><span class="chip">패턴</span></p><p class="learn">폰에서는 같은 CTA 자리를 공유 시트 기반 Mac 다운로드 링크 보내기로 바꾸는 법</p><p class="url">https://www.diabrowser.com/</p></figcaption></figure><figure><div class="shot"><img src="R11/1280.png" alt=""></div><figcaption><p class="meta"><b>R11</b> · flighty.com · 2026-11-08</p><p class="chips"><span class="chip">패턴</span></p><p class="learn">실시간 알림과 상태를 공항 안내판 문법에서 빌려 한눈에 읽히게 하는 제품 고유 비유</p><p class="url">https://flighty.com/</p></figcaption></figure><figure><div class="shot"><img src="R12/1280.png" alt=""></div><figcaption><p class="meta"><b>R12</b> · superhuman.com · 2026-11-08</p><p class="chips"><span class="chip">리듬</span></p><p class="learn">하나의 실제 워크플로를 빠른 장면 전환과 정교한 크롭으로 제품의 속도로 느끼게 하는 법</p><p class="url">https://superhuman.com/</p></figcaption></figure><figure><div class="shot"><img src="R13/1280.png" alt=""></div><figcaption><p class="meta"><b>R13</b> · notion.com · 2026-11-08</p><p class="chips"><span class="chip">레이아웃</span></p><p class="learn">제품의 핵심 개념을 실제 메일 화면과 짧은 문장으로 번갈아 증명하는 섹션 리듬</p><p class="url">https://www.notion.com/product/mail</p></figcaption></figure></main></html>
