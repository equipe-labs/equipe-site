<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><title>증거 필름 · equipe</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 16px/1.55 Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;background:var(--bg);color:var(--tx)}
a{color:inherit;text-decoration:none}
.top{position:relative;z-index:3;display:flex;align-items:center;gap:28px;height:64px;max-width:1280px;margin:0 auto;padding:0 40px}
.top nav{display:flex;gap:24px;font-size:14px;color:var(--mu)}.logo{display:flex;margin-right:12px}
.top .dl{margin-left:auto;font-size:14px;font-weight:500;height:34px;display:inline-flex;align-items:center;padding:0 14px;border-radius:8px;background:var(--pri);color:var(--on-pri)}
h1{font-weight:600;letter-spacing:-.035em;line-height:1.12}
.lead{color:var(--mu)}
.cta{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;border-radius:10px;background:var(--pri);color:var(--on-pri);font-weight:500;font-size:16px}
.sub{font-size:13px;color:var(--mu)}
.win{border-radius:12px;overflow:hidden;background:#141414;box-shadow:0 0 0 1px rgba(255,255,255,.10),0 40px 80px -20px rgba(0,0,0,.55),0 12px 24px -8px rgba(0,0,0,.4)}
.win .bar{height:30px;display:flex;align-items:center;gap:7px;padding:0 12px;background:#1b1b1b;border-bottom:1px solid rgba(255,255,255,.06)}
.win .bar i{width:11px;height:11px;border-radius:50%;background:#3a3a3a}
.win img{display:block;width:100%}
.art{position:absolute;inset:0;background-size:cover;background-position:center}
.cap{font-size:12px;color:var(--mu)}
.ph{display:none}
.cta2{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 20px;border-radius:10px;border:1px solid color-mix(in srgb,var(--tx) 22%,transparent);font-weight:500;font-size:16px}
@media (max-width:640px){.dk{display:none!important}.ph{display:flex;flex-direction:column;gap:10px;width:100%}.ph .cta,.ph .cta2{width:100%;justify-content:center;margin:0}.top .dl{display:none}}

:root{--bg:#0b0b0a;--tx:#f2f0e9;--mu:#b9b4a8;--pri:#f2f0e9;--on-pri:#11110f}
html,body{min-height:100%} body{background:#0b0b0a;overflow-x:hidden}
.top{height:60px}.top nav{color:#aaa69d}.top .dl{background:#f2f0e9;color:#11110f}
.fold{position:relative;min-height:900px;overflow:hidden}
.copy{position:relative;z-index:5;max-width:1280px;margin:0 auto;padding:46px 40px 0}
h1{font-size:54px;max-width:760px}.lead{font-size:18px;max-width:650px;margin-top:14px}
.actions{display:flex;align-items:center;gap:16px;margin-top:22px}.req{font-size:14px;color:var(--mu);margin-top:10px}
.mobile-actions{display:none}.visual{position:absolute;inset:300px 0 0;overflow:hidden}
.art{position:absolute;inset:0;background-repeat:no-repeat;background-size:cover}
.product{position:absolute;z-index:3;overflow:hidden;border-radius:12px;background:#141414;
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 36px 90px rgba(0,0,0,.55)}
.product>img{display:block;width:100%}.mobile-product{display:none}
@media(max-width:640px){
 .top{padding:0 20px;height:56px}.top nav,.top .dl{display:none}.fold{min-height:880px}
 .copy{padding:22px 20px 0}h1{font-size:29px;line-height:1.1}.lead{font-size:14px;line-height:1.45;margin-top:8px}
 .actions{margin-top:16px}.desktop-action{display:none}.mobile-actions{display:grid;width:100%;gap:9px}
 .mobile-actions .cta,.mobile-actions .cta2{width:100%;height:42px;justify-content:center}.req{font-size:11px;line-height:1.35;margin-top:7px}
 .visual{inset:286px 0 0}.desktop-product{display:none}.mobile-product{display:block;left:20px;right:20px;top:6px;background:#131313}
 .mobile-product img{display:block;width:100%}
}

.c .art{background-position:center 47%;filter:saturate(.58) brightness(.74)}
.c .visual:after{content:"";position:absolute;inset:0;background:linear-gradient(#0b0b0a 0,transparent 18%,rgba(0,0,0,.06) 82%,#080807 100%)}
.c .product{width:940px;right:max(54px,calc(50% - 640px));top:12px}
@media(max-width:640px){.c .art{background-size:auto 500px;background-position:47% 0;filter:saturate(.5) brightness(.56)}
 .c .product{width:auto;left:20px;right:20px}}
