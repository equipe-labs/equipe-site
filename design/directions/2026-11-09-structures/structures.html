<style>
*{box-sizing:border-box}html,body{margin:0;background:#e7e7e3;color:#111;font-family:Arial,"Apple SD Gothic Neo",sans-serif}body{padding:38px}.head{max-width:1480px;margin:0 auto 28px;display:flex;align-items:end;justify-content:space-between}.head h1{font-size:38px;letter-spacing:-.04em;margin:0}.head p{margin:0;color:#555;font-size:15px}.grid{max-width:1480px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:#f7f7f4;border:1px solid #c6c6c0;border-radius:14px;padding:18px;break-inside:avoid}.meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.meta h2{margin:0;font-size:18px;letter-spacing:-.025em}.meta p{margin:0;font-size:12px;color:#666}.pair{display:grid;grid-template-columns:1fr 112px;gap:10px;height:310px}.frame{position:relative;overflow:hidden;background:#121212;border:1px solid #3a3a3a;color:#efefeb;border-radius:7px}.desk{padding:18px}.phone{padding:10px}.logo{font-size:12px;font-weight:700;position:absolute;top:11px;left:13px}.copy{font-weight:700;letter-spacing:-.045em;line-height:.98}.desk .copy{font-size:25px}.phone .copy{font-size:15px}.muted{color:#969696}.hair{border:1px solid #444;border-radius:5px}.panel{background:#1d1d1d;border:1px solid #3d3d3d;border-radius:5px;padding:8px}.metric b{font-size:20px}.metric small,.work small,.decision small,.tag{display:block;color:#999;font-size:8px}.work{font-size:9px}.decision{background:#ecece8;color:#111;border-radius:5px;padding:8px;font-size:10px}.decision small{color:#555}.btn{display:inline-block;background:#111;color:#fff;border-radius:3px;padding:4px 7px;margin-top:5px;font-size:8px}.line{height:1px;background:#777}.dot{width:6px;height:6px;border-radius:50%;background:#eee}.step{font-size:8px;color:#aaa}.role{font-size:8px;border:1px solid #555;border-radius:10px;padding:3px 6px}.num{font-variant-numeric:tabular-nums}.cta{font-size:8px;padding:5px 7px;background:#eee;color:#111;border-radius:3px}.footnote{position:absolute;bottom:10 /* 18 */.c18 .board{position:absolute;left:12px;right:12px;top:45px;bottom:14px;display:grid;grid-template-rows:repeat(6,1fr)}.c18 .brow{display:grid;grid-template-columns:60px 1fr 85px 60px;align-items:center;border-bottom:1px solid #333;font-size:8px;padding:0 7px}.c18 .brow.hot{background:#eee;color:#111}.c18.phone .board{left:5px;right:5px;top:32px}.c18.phone .brow{grid-template-columns:20px 1fr 32px;padding:0 3px}.c18.phone .brow span:nth-child(3){display:none}

<body>
<header class="head"><div><h1>T-521 · 성장 사이클 구조 20</h1><p>같은 사실 · 같은 중립색 · 같은 임시 서체 · 생성 이미지 없음</p></div><p>1440 구조 + 390 구조 축소 비교</p></header>
<main class="grid" id="grid"></main>
<script>
const metric=`<div class="metric"><b class="num">18 → 0</b><small>LinkedIn 유입 → 다운로드 클릭</small></div>`;
const work=`<div class="work stack"><div><b>PM</b><small>폰에서 설치가 끊겨요</small></div><div><b>designer · frontend · QA</b><small>동선 설계 · 구현 · 검증</small></div></div>`;
const decision=`<div class="decision"><b>새 폰 동선을 공개할까요?</b><small>승인하면 배포하고 다시 측정해요.</small><span class="btn">공개</span></div>`;
const remeasure=`<div class="metric"><b>다시 측정</b><small>공개 뒤 같은 지표를 봐요</small></div>`;
const copy=`<div class="copy">최고의 스타트업 팀을 드려요.<br>승인만 하세요.</div>`;
const brandTop=`<span class="logo">e.</span>`;
const actions=`<div class="mobile-actions"><span class="cta">iPhone 앱에서 팀 보기</span><span class="cta">Mac 링크 보내기</span></div>`;
const concepts=[
['한 사이클, 한 테이크','실제 상태 세 개가 한 장면처럼 이어짐',(m)=>`${brandTop}${copy}<div class="cycle"><div class="crop">${metric}</div><div class="crop">${work}</div><div class="crop">${decision}${remeasure}</div></div>${m?actions:''}`],
['증거의 벽','지표·작업·결정을 편집한 정적 증거',(m)=>`${brandTop}<div class="wall"><div class="panel">${metric}</div><div class="panel">${work}</div>${decision}<div class="panel">${remeasure}</div></div>${m?actions:''}`],
['핸드오프 레일','한 일이 역할 사이를 이동',(m)=>`${brandTop}<div class="rail"></div><div class="nodes">${['지표','PM','design','frontend','QA'].map(x=>`<div class="node"><i class="dot"></i><span class="role">${x}</span></div>`).join('')}</div>${decision}`],
['팀 / 내 결정','일은 넓게, 사람의 결정은 좁고 선명하게',()=>`${brandTop}<div class="team"><div class="section-title">팀이 하는 일</div><div class="stack"><div class="panel">${metric}</div><div class="panel">${work}</div></div></div><div class="you">${decision}</div>`],
['전 / 작업 / 다시 측정','원인과 결과 사이에 팀의 일을 둠',()=>`${brandTop}<div class="triptych"><div class="panel">${metric}</div><div class="panel">${work}</div><div class="panel">${decision}${remeasure}</div></div>`],
['한 티켓의 실','하나의 문제를 시간순 대화로 추적',()=>`${brandTop}<div class="thread"><div class="msg"><b>09:10 · data</b>다운로드 클릭 0건</div><div class="msg"><b>09:18 · PM</b>폰 설치 동선을 고쳐요</div><div class="msg"><b>10:42 · designer</b>두 행동을 정리했어요</div><div class="msg"><b>12:06 · QA</b>390폭 검증 완료</div>${decision}</div>`],
['라이브 여백','큰 약속 옆 한 줄짜리 실제 상태',()=>`${brandTop}${copy}<div class="margin"><div class="stack">${metric}${work}${decision}</div></div>`],
['필름스트립','성장 사이클을 짧은 프레임으로 편집',()=>`${brandTop}${copy}<div class="film">${[metric,work,'<div class="work"><b>QA 통과</b><small>390 · 8개 언어</small></div>',decision,remeasure].map(x=>`<div class="screen">${x}</div>`).join('')}</div>`],
['한 창의 변신','한 제품 표면이 상태만 바뀜',()=>`${brandTop}<div class="window screen"><div class="tabs"><span>지표</span><span>로드맵</span><span>확인 필요</span></div><div class="inside"><div>${metric}${work}</div><div>${decision}${remeasure}</div></div></div>`],
['신호 계단','근거가 쌓여 결정에 도착',()=>`${brandTop}<div class="stairs">${[['지표',metric],['판단',work],['검증','<b>QA 통과</b>'],['결정',decision]].map(([a,b])=>`<div class="stair"><span class="section-title">${a}</span>${b}</div>`).join('')}</div>`],
['작업 큐에서 결정 한 건','많은 작업 중 사람이 볼 한 건만 떠오름',()=>`${brandTop}<div class="queue">${['지표 연결','폰 동선 시안','구현','QA 검증','배포 준비'].map((x,i)=>`<div class="qrow"><span class="num">0${i+1}</span> · ${x}</div>`).join('')}</div>${decision}`],
['밤 근무 일지','사람이 없는 동안 이어진 시간 기록',()=>`${brandTop}<div class="log">${[['23:10','지표에서 끊김 발견'],['23:18','PM이 다음 일을 정함'],['00:42','designer 동선 완성'],['02:06','frontend 구현'],['03:12','QA 통과'],['07:30','공개 결정 도착']].flatMap(([a,b])=>[`<time>${a}</time>`,`<div>${b}</div>`]).join('')}</div>`],
['닫힌 루프','배포가 끝이 아니라 지표로 돌아옴',()=>`${brandTop}<div class="loop"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="core center">${metric}</div>${decision}`],
['맥락과 확대','전체는 흐리게, 중요한 상태만 확대',()=>`${brandTop}<div class="context screen">${work}</div><div class="zoom1 crop">${metric}</div><div class="zoom2">${decision}</div>`],
['증거 포스터','숫자 하나와 팀의 답을 크게 편집',()=>`${brandTop}<div class="poster"><div class="proof"><div><div class="big-num">0</div><small class="muted">다운로드 클릭</small></div>${work}</div><div class="stack">${decision}${remeasure}</div></div>`],
['세로 여정','아래로 읽으며 한 사이클을 닫음',()=>`${brandTop}<div class="journey">${[['01','지표','18건 → 0건'],['02','PM','폰 동선 문제'],['03','팀','설계 · 구현 · QA'],['04','나','공개 결정'],['05','지표','다시 측정']].map(([n,a,b])=>`<div class="jrow"><span data-n="${n}">${n} · ${a}</span><span>${b}</span></div>`).join('')}</div>`],
['겹친 산출물','팀의 결과물이 결정 한 건으로 모임',()=>`${brandTop}<div class="sheets"><div class="sheet panel">${metric}</div><div class="sheet panel">${work}</div><div class="sheet panel">${decision}</div></div>`],
['상태 전광판','역할별 현재 상태를 한 줄씩',()=>`${brandTop}<div class="board">${[['data','끊김 발견','완료'],['PM','다음 일 판단','완료'],['designer','폰 동선','완료'],['frontend','구현','완료'],['QA','390폭 검증','완료'],['나','공개 결정','내 차례']].map((x,i)=>`<div class="brow ${i===5?'hot':''}"><span>${x[0]}</span><span>${x[1]}</span><span>${x[2]}</span><span>${i===5?'결정':'✓'}</span></div>`).join('')}</div>`],
['90% 팀 / 10% 나','화면 면적으로 역할 비율을 표현',()=>`${brandTop}<div class="ninety"><div class="team90 panel"><div>${metric}</div><div>${work}</div><div>${remeasure}</div></div><div class="you10">${decision}</div></div>`],
['폰에서 Mac으로','폰의 다음 행동이 성장 사이클에 바로 연결',()=>`${brandTop}<div class="relay"><div class="mini-phone"><b>팀이 일하고 있어요</b><div class="stack" style="margin-top:10px">${work}<span class="cta center">iPhone 앱에서 보기</span><span class="cta center">Mac 링크 보내기</span></div></div><div class="mac screen">${metric}${decision}</div></div>`]
];
const grid=document.querySelector('#grid');
concepts.forEach((c,i)=>{const n=i+1;const card=document.createElement('section');card.className='card';card.innerHTML=`<div class="meta"><h2>${String(n).padStart(2,'0')} · ${c[0]}</h2><p>${c[1]}</p></div><div class="pair"><div class="frame desk c${n}">${c[2](false)}</div><div class="frame phone c${n}">${c[2](true)}</div></div>`;grid.appendChild(card)});
</script>
</body>
</html>
