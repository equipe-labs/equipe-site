# Creates or updates the "equipe.im KPI" dashboard from scripts/posthog-dashboard.mjs. Run by hand
# (Actions → "PostHog KPI dashboard" → Run workflow) after changing a panel. See docs/analytics.md.
name: PostHog KPI dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/posthog-dashboard.mjs
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_APP_HOST: ${{ vars.POSTHOG_APP_HOST || 'https://us.posthog.com' }}
